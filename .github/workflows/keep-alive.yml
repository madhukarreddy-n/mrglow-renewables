name: Keep Supabase alive

on:
  schedule:
    - cron: "0 4 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          url="${APP_URL:-https://www.mrglowrenewables.in}/api/health"
          curl -fsS "$url"
